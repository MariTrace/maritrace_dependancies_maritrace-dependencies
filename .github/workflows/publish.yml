name: Publish BOM to GitHub Packages

# Publishes com.maritrace:maritrace-dependencies to GitHub Packages whenever the
# BOM changes on main, or on demand. Uses the automatic per-run GITHUB_TOKEN, so no
# personal tokens are needed to publish.

on:
  push:
    branches: [ main ]
    paths:
      - 'pom.xml'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github            # matches <distributionManagement><id>github</id>
          server-username: MAVEN_USERNAME
          server-password: MAVEN_TOKEN

      - name: Publish
        run: mvn --batch-mode --no-transfer-progress deploy
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
